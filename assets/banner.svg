<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Gradient Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Dynamic / Animated Background Graphics (Behind Text) -->
  <g opacity="0.6">
    <!-- Pulsing Orbs -->
    <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)">
      <animate attributeName="r" values="100;130;100" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="8s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="1050" cy="280" r="140" fill="#ec4899" opacity="0.15" filter="url(#glow)">
      <animate attributeName="r" values="120;150;120" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated Monolith to Microservices Transformation Flow Lines -->
    <path d="M -50,220 C 300,120 500,320 800,180 C 1000,80 1150,260 1250,200" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="15s" repeatCount="indefinite"/>
    </path>

    <!-- Floating Microservice Nodes (Background Decorative) -->
    <g transform="translate(90, 250)">
      <animateTransform attributeName="transform" type="translate" values="90,250; 90,240; 90,250" dur="6s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="130" height="44" rx="8" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
      <circle cx="20" cy="22" r="6" fill="#10b981"/>
      <text x="35" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">API Gateway</text>
    </g>

    <g transform="translate(980, 60)">
      <animateTransform attributeName="transform" type="translate" values="980,60; 980,72; 980,60" dur="7s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="130" height="44" rx="8" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1"/>
      <circle cx="20" cy="22" r="6" fill="#6366f1"/>
      <text x="35" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Service Mesh</text>
    </g>
  </g>

  <!-- Foreground Main Title & Subtitle (Always Perfectly Legible & Prominent) -->
  <g text-anchor="middle">
    <!-- Top Category Badge -->
    <rect x="475" y="45" width="250" height="28" rx="14" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1"/>
    <text x="600" y="64" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AWESOME ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="600" y="140" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Microservices Refactoring &amp; Migration
    </text>

    <!-- Subtitle Line -->
    <text x="600" y="190" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      Curated Monolith Decomposition Platforms, Service Meshes, API Gateways &amp; Observability Tools
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(330, 235)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="80" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⚡ Monolith Split</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="180" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="270" y="22" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🌐 Service Mesh &amp; Ingress</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="160" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="460" y="22" fill="#4ade80" font-family="system-ui, sans-serif" font-size="13" font-weight="600">📊 Cloud Migration</text>
    </g>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#accentGrad)"/>
</svg>
